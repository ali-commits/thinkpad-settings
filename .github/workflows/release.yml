name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release packages
    runs-on: ubuntu-latest
    container: fedora:44
    outputs:
      version: ${{ steps.meta.outputs.version }}
      exists: ${{ steps.meta.outputs.exists }}

    steps:
      # See ci.yml for why each of these is named explicitly with weak deps off.
      # rpm-sign and gnupg2 are additionally needed to sign the release.
      - name: Install toolchain
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git-core rpm-build rpmdevtools rpmlint rpm-sign gnupg2 \
            python3-devel pyproject-rpm-macros python3-pip python3-setuptools \
            desktop-file-utils libappstream-glib \
            python3-gobject python3-cairo gobject-introspection \
            gtk4 libadwaita xorg-x11-server-Xvfb

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Read version and check the tag is free
        id: meta
        run: |
          version=$(cat VERSION)
          spec_version=$(sed -n 's/^Version:[[:space:]]*//p' thinkpad-settings.spec)
          if [ -z "$version" ] || [ -z "$spec_version" ]; then
            echo "Could not read VERSION or the spec's Version:" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # VERSION is the source of truth; pyproject and the About dialog
          # derive from it and cannot drift. The spec has to carry a literal
          # because rpmbuild parses it before unpacking Source0, so this is the
          # one pair that can disagree.
          if [ "$version" != "$spec_version" ]; then
            echo "VERSION says '$version' but the spec says '$spec_version'" >&2
            echo "Run ./bump-version.sh to set both." >&2
            exit 1
          fi
          grep -q "release version=\"$version\"" \
            data/com.rabeei.ThinkPadSettings.metainfo.xml \
            || { echo "metainfo.xml has no <release> entry for $version" >&2; exit 1; }

          # Re-pushing main without a version bump should be a no-op, not a
          # failed run.
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v$version already exists — nothing to release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate packaging metadata
        if: steps.meta.outputs.exists == 'false'
        run: |
          desktop-file-validate data/com.rabeei.ThinkPadSettings.desktop
          appstream-util validate-relax --nonet \
            data/com.rabeei.ThinkPadSettings.metainfo.xml
          python3 tests/check_catalog.py

      - name: Run test suite
        if: steps.meta.outputs.exists == 'false'
        run: xvfb-run -a python3 tests/smoke.py

      - name: Build RPM
        if: steps.meta.outputs.exists == 'false'
        run: ./build-rpm.sh

      - name: Collect packages
        if: steps.meta.outputs.exists == 'false'
        run: |
          mkdir -p dist
          cp ~/rpmbuild/RPMS/noarch/*.rpm dist/
          cp ~/rpmbuild/SRPMS/*.rpm dist/

      - name: Sign packages
        if: steps.meta.outputs.exists == 'false'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "GPG_PRIVATE_KEY secret is missing — refusing to publish unsigned packages." >&2
            exit 1
          fi
          GNUPGHOME="$(mktemp -d)"; chmod 700 "$GNUPGHOME"; export GNUPGHOME
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          printf '%s' "$GPG_PASSPHRASE" > "$GNUPGHOME/passphrase"
          chmod 600 "$GNUPGHOME/passphrase"

          rpmsign --define "_gpg_name $GPG_KEY_ID" \
                  --define "_gpg_sign_cmd_extra_args --pinentry-mode loopback --batch --passphrase-file $GNUPGHOME/passphrase" \
                  --addsign dist/*.rpm

          # A silently unsigned package is worse than a failed release, so
          # confirm the header signature is really there before shipping.
          for rpm in dist/*.rpm; do
            rpm -qp --qf '%{RSAHEADER:pgpsig}\n' "$rpm" 2>/dev/null | grep -q 'Key ID' \
              || { echo "NOT SIGNED: $rpm" >&2; exit 1; }
            echo "signed: $(basename "$rpm")"
          done

      - name: Checksums
        if: steps.meta.outputs.exists == 'false'
        run: |
          (cd dist && sha256sum *.rpm > SHA256SUMS)
          ls -la dist/

      - uses: actions/upload-artifact@v7
        if: steps.meta.outputs.exists == 'false'
        with:
          name: release-packages
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.exists == 'false'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          notes=$(mktemp)
          {
            echo "## Install"
            echo
            echo '```'
            echo "sudo dnf install ./thinkpad-settings-${VERSION}-1.fc44.noarch.rpm"
            echo '```'
            echo
            echo "Or build from the source RPM."
            echo
            echo "### Checksums"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > "$notes"

          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file "$notes" \
            --target "${GITHUB_SHA}" \
            dist/*.rpm dist/SHA256SUMS
