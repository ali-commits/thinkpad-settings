# Run once after cloning:
#
#   uv venv --system-site-packages
#   uv sync
#   uv run pre-commit install
#
# The type checkers run as `system` hooks through `uv run` rather than in
# pre-commit's own isolated environments, so they use the exact versions pinned
# in uv.lock. Letting pre-commit resolve its own mypy would silently drift from
# what CI runs.
#
# The venv needs --system-site-packages because the test suite imports the
# distro's PyGObject; `uv sync` preserves that flag on an existing venv.

default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.(rev|asc)$'
      - id: end-of-file-fixer
        exclude: '\.(rev|asc)$'
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: mixed-line-ending
        args: [--fix=lf]
      # The signing key must never be committed; the public half is fine.
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=2048]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (lint)
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff (format)
        entry: uv run ruff format
        language: system
        types: [python]

      - id: mypy
        name: mypy (strict)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        args: [thinkpad_settings, tests]

      - id: pyrefly
        name: pyrefly
        entry: uv run pyrefly
        language: system
        types: [python]
        pass_filenames: false
        args: [check]

      - id: uv-lock
        name: uv.lock is current
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: '^(pyproject\.toml|uv\.lock)$'

      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]

      # The catalog is hand-edited and easy to get subtly wrong: a value label
      # that no longer matches the firmware, or a description asserting one
      # machine's state as fact. Cheap to check, so check every commit.
      - id: catalog
        name: catalog integrity
        entry: uv run python tests/check_catalog.py
        language: system
        pass_filenames: false
        files: '^(thinkpad_settings/metadata\.(py|json)|tests/(check_catalog\.py|fixture-.*\.json))$'

      # Four files hold the version and the release workflow refuses to publish
      # when they disagree. Catching that here beats catching it mid-release.
      - id: version-consistency
        name: version consistency
        entry: bash -c 'v=$(sed -n "s/^Version:[[:space:]]*//p" thinkpad-settings.spec);
          grep -q "^version = \"$v\"" pyproject.toml &&
          grep -q "^VERSION = \"$v\"" thinkpad_settings/app.py &&
          grep -q "release version=\"$v\"" data/com.rabeei.ThinkPadSettings.metainfo.xml ||
          { echo "Version files disagree with the spec ($v) — use ./bump-version.sh"; exit 1; }'
        language: system
        pass_filenames: false
        files: '^(thinkpad-settings\.spec|pyproject\.toml|thinkpad_settings/app\.py|data/.*\.metainfo\.xml)$'
