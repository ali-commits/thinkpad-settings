    <path fill="#f6d32d" d="M0-14.5a14.5 14.5 0 0 1 5.2 1l1.9-3.6 4.4 2.3-1.9 3.6a14.5 14.5 0 0 1 3.6 3.6l3.6-1.9 2.3 4.4-3.6 1.9a14.5 14.5 0 0 1 0 5.2l3.6 1.9-2.3 4.4-3.6-1.9a14.5 14.5 0 0 1-3.6 3.6l1.9 3.6-4.4 2.3-1.9-3.6a14.5 14.5 0 0 1-5.2 0l-1.9 3.6-4.4-2.3 1.9-3.6a14.5 14.5 0 0 1-3.6-3.6l-3.6 1.9-2.3-4.4 3.6-1.9a14.5 14.5 0 0 1 0-5.2l-3.6-1.9 2.3-4.4 3.6 1.9a14.5 14.5 0 0 1 3.6-3.6l-1.9-3.6 4.4-2.3 1.9 3.6A14.5 14.5 0 0 1 0-14.5z"/>
